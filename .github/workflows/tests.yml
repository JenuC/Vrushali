name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No dependencies: the script and the tests are standard library only.
      # The suite regenerates every example and diffs it against the committed
      # output, so a stale example fails the build.
      - name: Run tests
        run: python -m unittest discover -s tests -v
